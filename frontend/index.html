<!DOCTYPE html>
<html>
<head>
    <title>AI Customer Support Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <h1>AI Customer Support Chatbot</h1>
        <p class="subtitle">24/7 automated customer support assistant</p>

        <div class="chat-box">
            <div class="bot-message">Hello! How can I help you today?</div>
            <div class="user-message">Where is my order?</div>
            <div class="bot-message">Please provide your order ID so I can check the order status.</div>
        </div>

        <div class="input-area">
            <input type="text" placeholder="Type your message here...">
            <button>Send</button>
        </div>
    </div>
</body>
</html>
